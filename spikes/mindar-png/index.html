<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#07101f" />
    <link rel="icon" href="data:," />
    <title>MindAR PNG Phase 0</title>
  </head>
  <body>
    <main>
      <div id="viewport" aria-hidden="true"></div>
      <section class="panel">
        <h1>MindAR PNG Phase 0</h1>
        <p id="status" role="status" aria-live="polite">相機尚未啟動</p>
        <p class="privacy">相機畫面只在你的裝置中用來辨識圖像，不會拍照、錄影或上傳。離開頁面後相機會立即停止。</p>
        <div class="actions">
          <button id="start" type="button">開啟相機</button>
          <button id="stop" type="button" disabled>停止相機</button>
        </div>
        <img id="target" src="./card.png" alt="實機測試時，請用另一個螢幕顯示這張 MindAR 官方辨識圖" />
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
